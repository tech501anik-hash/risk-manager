<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" rx="80" fill="#000000"/>

  <!-- Grid: 4 cols x 5 rows, block=80px, gap=10px, unit=90px -->
  <!-- Offset to center: total width=4*90-10=350, total height=5*90-10=440 -->
  <!-- x start = (500-350)/2 = 75, y start = (500-440)/2 = 30 -->

  <!-- Row 0: all 4 -->
  <rect x="75"  y="30"  width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="165" y="30"  width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="255" y="30"  width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="345" y="30"  width="80" height="80" rx="20" fill="#ffffff"/>

  <!-- Row 1: col 0 and col 3 (open bowl) -->
  <rect x="75"  y="120" width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="345" y="120" width="80" height="80" rx="20" fill="#ffffff"/>

  <!-- Row 2: all 4 (crossbar) -->
  <rect x="75"  y="210" width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="165" y="210" width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="255" y="210" width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="345" y="210" width="80" height="80" rx="20" fill="#ffffff"/>

  <!-- Row 3: col 0 and col 2 (legs split) -->
  <rect x="75"  y="300" width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="255" y="300" width="80" height="80" rx="20" fill="#ffffff"/>

  <!-- Row 4: col 0 and col 3 (feet) -->
  <rect x="75"  y="390" width="80" height="80" rx="20" fill="#ffffff"/>
  <rect x="345" y="390" width="80" height="80" rx="20" fill="#ffffff"/>
</svg>
